[package]
name = "klipt-desktop"
version = "0.1.0"
edition = "2021"
description = "Klipt desktop app"
publish = false

[lib]
name = "klipt_desktop_lib"
crate-type = ["rlib"]

[dependencies]
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }
