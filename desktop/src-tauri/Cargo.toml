[package]
name = "klipt-desktop"
version = "0.1.0"
edition = "2021"
description = "Klipt desktop app"
publish = false

[lib]
name = "klipt_desktop_lib"
crate-type = ["rlib"]

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rodio = { version = "0.23.0", default-features = false, features = ["wav", "playback"] }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "time", "rt", "macros"] }
uuid = { version = "1.29.2", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12.3", features = ["tokio"] }
futures-util = "0.3.34"
nix = { version = "0.31.3", features = ["process", "signal"] }
