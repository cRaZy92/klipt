[package]
name = "klipt-desktop"
version = "0.1.0"
edition = "2021"
description = "Klipt desktop app"
publish = false

[lib]
name = "klipt_desktop_lib"
crate-type = ["rlib"]

[dependencies]
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
