name: desktop-windows

on:
  push:
    branches: [main, feat/desktop]
    paths:
      - desktop/**
      - scripts/fetch-obs-windows.ps1
      - scripts/fetch-ffmpeg-windows.ps1
      - scripts/package-recorder-windows.ps1
      - .github/workflows/desktop-windows.yml
  workflow_dispatch:

permissions:
  contents: write # publish a GitHub Release for every app change pushed to main

# Releases are numbered by run, so two pushes must not publish out of order.
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      OBS_VERSION: 33.0.1
      DEPS: ${{ github.workspace }}\..\klipt-deps
    steps:
      - uses: actions/checkout@v7
        with:
          # The version counts main's commits (see docs/RELEASING.md): needs the whole history.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Fetch OBS runtime and headers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fetch-obs-windows.ps1 -Version $env:OBS_VERSION -Dest $env:DEPS

      - name: Build and unit-test klipt-recorder
        shell: pwsh
        working-directory: desktop
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          $env:OBS_INCLUDE_DIR = "$env:DEPS\include\obs"
          $env:SIMDE_INCLUDE_DIR = "$env:DEPS\include\simde"
          cargo build -p klipt-recorder --release --locked
          # The real-OBS CLI tests need a GPU and run locally (KLIPT_TEST_OBS_ROOT); here they skip.
          cargo test -p klipt-recorder --release --locked

      - name: Package
        shell: pwsh
        run: scripts/package-recorder-windows.ps1 -ObsDir "$env:DEPS\obs" -RecorderExe desktop\target\release\klipt-recorder.exe -Out dist\klipt-recorder-windows

      # Bundled into the installer (tauri.windows.conf.json); tauri-build checks these exist,
      # so this comes before anything compiles klipt-desktop.
      - name: Fetch ffmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-windows.ps1 -Dest dist\ffmpeg

      # Compiles and tests the Windows-only game detection code (Win32 foreground/process/registry).
      - name: Test klipt-desktop game detection
        shell: pwsh
        working-directory: desktop
        run: cargo test -p klipt-desktop --locked games

      # Runners have no GPU, so libobs may fail to create a D3D11 device. Informational only.
      - name: Smoke test (--list)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\klipt-recorder-windows\bin\64bit\klipt-recorder.exe -ArgumentList '--list' `
            -NoNewWindow -PassThru -Wait -RedirectStandardOutput list.out -RedirectStandardError list.err
          Get-Content list.out
          Get-Content list.err | Select-Object -Last 20
          exit $p.ExitCode

      - uses: actions/upload-artifact@v7
        with:
          name: klipt-recorder-windows
          path: dist/klipt-recorder-windows
          if-no-files-found: error

      - uses: pnpm/action-setup@v6 # version from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the installer
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        working-directory: desktop
        run: pnpm tauri build

      # main: every push is a release. Its version is 0.1.<run number> (always increasing, so the
      # updater sees it as newer), and the installer is signed for the updater
      # (TAURI_SIGNING_PRIVATE_KEY secret; see docs/RELEASING.md).
      - name: Build the signed release installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "the TAURI_SIGNING_PRIVATE_KEY secret is missing" }
          $base = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version.Split('.')
          # MAJOR.MINOR.<commits on main>: the same number the Linux package (PKGBUILD) computes.
          $version = "$($base[0]).$($base[1]).$(git rev-list --count HEAD)"
          "KLIPT_VERSION=$version" >> $env:GITHUB_ENV
          @{ version = $version; bundle = @{ createUpdaterArtifacts = $true } } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM src-tauri/tauri.release.conf.json
          pnpm tauri build --config "$PWD/src-tauri/tauri.release.conf.json"

      - name: Write latest.json for the updater
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $version = $env:KLIPT_VERSION
          @{
            version = $version
            notes = "Klipt $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              'windows-x86_64' = @{
                signature = $sig.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM desktop/target/release/bundle/nsis/latest.json
          Get-Content desktop/target/release/bundle/nsis/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: klipt-windows-installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KLIPT_VERSION }}
          name: Klipt ${{ env.KLIPT_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Automatic build of ${{ github.sha }}.
          files: |
            desktop/target/release/bundle/nsis/*-setup.exe
            desktop/target/release/bundle/nsis/latest.json
