services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klipt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: klipt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klipt -d klipt"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host port for a tunnel or reverse proxy (e.g. Pangolin) to reach. Change with KLIPT_PORT (default 3260).
      - "${KLIPT_PORT:-3260}:3000"
    volumes:
      - klipt-data:/data
    environment:
      BASE_URL: ${BASE_URL:?set BASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SHARE_SIGNUP: ${SHARE_SIGNUP:-on}
      TRANSCODE: ${TRANSCODE:-on}
      TRANSCODE_CRF: ${TRANSCODE_CRF:-23}
      TRANSCODE_PRESET: ${TRANSCODE_PRESET:-medium}
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgres://klipt@db:5432/klipt

volumes:
  pgdata:
  klipt-data:
